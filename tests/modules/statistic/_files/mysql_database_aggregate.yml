# State tables: declared as fixtures with no rows of their own.
# PhpunitDataset::sendToDatabase() clears every fixture table with DELETE
# before re-inserting, so any rows committed by a previous test's run()
# (frontiers are GREATEST-monotonic and would otherwise make later tests
# resume instead of replaying the 2022/2023 backlog) are wiped at the start
# of every test. restoreWrittenTables() additionally recreates these tables
# with a fresh counter per test where they carry an auto-increment column.
